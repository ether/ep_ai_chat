name: Test and Release

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  frontend-tests:
    uses: ./.github/workflows/frontend-tests.yml

  release:
    needs: [lint, backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # npm OIDC trusted publishing. `id-token: write` lets @semantic-release/npm
    # exchange the GitHub-issued OIDC token for a short-lived, package-scoped
    # publish credential at the registry, so there is no stored NPM_TOKEN to
    # expire, rotate or leak, and the publish carries a provenance statement.
    #
    # ONE-TIME SETUP, on https://www.npmjs.com/package/ep_ai_chat/access
    #   Trusted Publishers -> Add -> Provider: GitHub Actions
    #     Organization or user: ether
    #     Repository:           ep_ai_chat
    #     Workflow filename:    test-and-release.yml      <- this file: it runs the publish
    #     Environment:          (leave blank)
    #     Allowed actions:      must permit `npm publish`
    #
    # Until that entry exists the registry rejects the exchange with
    # "404 OIDC token exchange error - package not found", and a plain
    # `npm publish` fails with an equally misleading `E404` on the PUT: npm
    # answers "not found" rather than "not authorised" for any caller it will
    # not let write to the package.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # OIDC trusted publishing needs npm >= 11.5.1. Node 24 is an LTS line
          # that every npm 11.x and 12.x supports; Node 25 is not — npm 12
          # requires ^22.22.2 || ^24.15.0 || >=26.0.0, so on Node 25 the npm
          # upgrade below dies with EBADENGINE.
          node-version: 24
      # Pinned to a range rather than @latest: the next npm major to drop this
      # Node line would otherwise silently break publishing again.
      - name: Upgrade npm to >=11.5.1 (required for trusted publishing)
        run: npm install -g npm@^11.5.1
      # No NPM_TOKEN here on purpose: authentication is OIDC only. When
      # NPM_TOKEN is set, @semantic-release/npm silently falls back to token
      # auth whenever the OIDC exchange fails, which hides a missing trusted
      # publisher behind a token error instead of reporting it.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
